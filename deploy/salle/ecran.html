<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Break — écran de salle</title>
<style>
  /* Tout est en dur : cette page doit s'afficher sans réseau extérieur. */
  :root {
    --bg: #071a13; --ink: #f5f1e6; --muted: #93998d;
    --or: #d9b450; --or-clair: #e8c86a; --jade: #6fd8ae; --live: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Une règle d'auteur (`.direct { display: flex }`) l'emporte sur celle du
     navigateur pour `[hidden]` : sans ceci, rien ne se cache jamais. */
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  .scene { position: relative; height: 100dvh; width: 100dvw; }
  video { height: 100%; width: 100%; object-fit: contain; background: #000; }

  .attente { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: var(--bg); text-align: center; }
  .attente p { color: var(--muted); font-size: clamp(14px, 1.6vw, 22px); }
  .marque { letter-spacing: .24em; font-size: clamp(13px, 1.4vw, 20px); color: var(--or-clair); }

  /* Le bandeau du score, lisible depuis le fond de la salle. */
  .tableau { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: clamp(14px, 2vw, 36px);
    padding: clamp(10px, 1.2vh, 20px) clamp(18px, 2vw, 40px);
    background: rgba(0,0,0,.62); backdrop-filter: blur(10px); border-radius: 999px; }

  .joueur { display: flex; align-items: center; gap: 10px; max-width: 26vw; }
  .joueur span { font-size: clamp(16px, 2.2vw, 40px); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { width: clamp(8px, .9vw, 16px); height: clamp(8px, .9vw, 16px); border-radius: 999px; flex: 0 0 auto; }
  .main.a { background: var(--or); } .main.b { background: var(--jade); }
  .main.off { background: transparent; }

  .score { font-size: clamp(34px, 5.5vw, 110px); font-weight: 800; letter-spacing: -.04em;
    line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score .a { color: var(--or-clair); } .score .b { color: var(--jade); }
  .score .tiret { color: rgba(245,241,230,.35); margin: 0 .12em; }

  .direct { position: absolute; top: 2.5vh; right: 2.5vw; display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; background: rgba(0,0,0,.62); backdrop-filter: blur(10px); border-radius: 999px;
    color: var(--live); font-size: clamp(11px, 1.1vw, 18px); font-weight: 700; letter-spacing: .12em; }
  .pastille { width: 9px; height: 9px; border-radius: 999px; background: var(--live); animation: bat 1.8s infinite; }
  @keyframes bat { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  .bas { position: absolute; bottom: 2.5vh; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; }
  .etiquette { padding: 7px 16px; background: rgba(0,0,0,.6); backdrop-filter: blur(10px);
    border-radius: 999px; font-size: clamp(11px, 1.1vw, 18px); color: rgba(245,241,230,.75); }

  /* Opaque, pas translucide : à 90 % le message d'attente et le tableau
     transparaissaient derrière le nom du vainqueur. */
  .fini { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; background: var(--bg); }
  .fini h1 { font-size: clamp(28px, 5vw, 80px); color: var(--or-clair); }
  .fini p { font-size: clamp(16px, 2vw, 32px); color: var(--muted); }
</style>
</head>
<body>
<div class="scene">
  <video id="flux" autoplay muted playsinline></video>

  <div class="attente" id="attente">
    <div class="marque">MASTER BREAK</div>
    <p id="attente-texte">En attente de la caméra…</p>
  </div>

  <div class="tableau">
    <div class="joueur"><span id="na">Joueur A</span><i class="main off" id="ma"></i></div>
    <div class="score"><span class="a" id="sa">0</span><span class="tiret">–</span><span class="b" id="sb">0</span></div>
    <div class="joueur"><i class="main off" id="mb"></i><span id="nb">Joueur B</span></div>
  </div>

  <div class="direct" id="direct" hidden><i class="pastille"></i> EN DIRECT</div>

  <div class="bas">
    <div class="etiquette" id="info">course à 5 · 8-ball</div>
  </div>

  <div class="fini" id="fini" hidden>
    <h1 id="fini-nom">—</h1>
    <p id="fini-score">—</p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------- le score, en direct */
// Le flux d'état vient de la boîte, sur le réseau de la salle.
const source = new EventSource("/etat");
source.addEventListener("etat", (e) => peindre(JSON.parse(e.data)));

function peindre(etat) {
  $("na").textContent = etat.a.nom;
  $("nb").textContent = etat.b.nom;
  $("sa").textContent = etat.a.score;
  $("sb").textContent = etat.b.score;
  $("ma").className = "main " + (etat.main === "a" ? "a" : "off");
  $("mb").className = "main " + (etat.main === "b" ? "b" : "off");
  $("info").textContent =
    (etat.titre ? etat.titre + " · " : "") + "course à " + etat.cible + " · " + etat.discipline;
  $("direct").hidden = etat.statut !== "encours";

  const fini = etat.statut === "fini";
  $("fini").hidden = !fini;
  if (fini) {
    const v = etat.vainqueur;
    $("fini-nom").textContent = v ? etat[v].nom + " l'emporte" : "Match nul";
    $("fini-score").textContent = etat.a.score + " – " + etat.b.score;
  }
}

/* -------------------------------------------------------------- la vidéo */
// WHEP : on envoie une offre SDP au MediaMTX local, il répond, le flux part.
// Aucun appel vers l'extérieur — tout reste sur le réseau de la salle.
async function brancherVideo() {
  const { media, chemin } = await fetch("/config").then((r) => r.json());
  if (!media) {
    $("attente-texte").textContent = "Serveur média non configuré sur la boîte (MB_SALLE_MEDIA).";
    return;
  }

  const pc = new RTCPeerConnection();
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });

  pc.ontrack = (e) => {
    $("flux").srcObject = e.streams[0];
    $("attente").hidden = true;
  };

  pc.onconnectionstatechange = () => {
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      $("attente").hidden = false;
      $("attente-texte").textContent = "Caméra perdue. Nouvelle tentative…";
      pc.close();
      setTimeout(brancherVideo, 4000);
    }
  };

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((ok) => {
      if (pc.iceGatheringState === "complete") return ok();
      pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && ok());
      setTimeout(ok, 2000);
    });

    const reponse = await fetch(media + "/" + chemin + "/whep", {
      method: "POST",
      headers: { "content-type": "application/sdp" },
      body: pc.localDescription.sdp,
    });

    if (!reponse.ok) {
      $("attente-texte").textContent = "La caméra n'émet pas encore.";
      pc.close();
      setTimeout(brancherVideo, 4000);
      return;
    }

    await pc.setRemoteDescription({ type: "answer", sdp: await reponse.text() });
  } catch (e) {
    $("attente-texte").textContent = "Serveur média injoignable sur le réseau de la salle.";
    pc.close();
    setTimeout(brancherVideo, 5000);
  }
}

brancherVideo();

// Un téléviseur qui se met en veille coupe tout : on se rebranche au réveil.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && $("flux").srcObject === null) brancherVideo();
});
</script>
</body>
</html>
